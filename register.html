
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Rajasthan City Guide Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">
            <span>RAJASTHAN</span>
            <small>City Guide Portal</small>
        </a>
        <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="cities.html">Cities</a>
            <a href="places.html">Places</a>
            <a href="hotels.html">Hotels</a>
            <a href="restaurants.html">Restaurants</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<section class="auth-section">
    <div class="auth-card">
        <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
        <h1>Create Account</h1>
        <p>Register to explore Rajasthan with us.</p>

        <form id="registerForm">
            <label for="registerName">Full Name</label>
            <input type="text" id="registerName" placeholder="Enter your full name" required>

            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail" placeholder="Enter your email" required>

            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" placeholder="Create password" minlength="6" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" minlength="6" required>

            <button type="submit" class="auth-submit">Create Account</button>
            <p id="registerMessage" class="form-message"></p>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
        <a href="index.html" class="back-home">← Back to Home</a>
    </div>
</section>

<footer class="footer">
    <div class="footer-bottom">
        <p>© 2026 City Guide Portal – Rajasthan. All Rights Reserved.</p>
    </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("registerName").value.trim();
    const email = document.getElementById("registerEmail").value.trim().toLowerCase();
    const password = document.getElementById("registerPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("registerMessage");

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.className = "form-message error";
        return;
    }

    const users = JSON.parse(localStorage.getItem("rajasthanUsers")) || [];

    if (users.some(user => user.email.toLowerCase() === email)) {
        message.textContent = "This email is already registered. Please login.";
        message.className = "form-message error";
        return;
    }

    users.push({
        name: name,
        email: email,
        password: password
    });

    localStorage.setItem("rajasthanUsers", JSON.stringify(users));

    message.textContent = "Registration successful! You can now login.";
    message.className = "form-message success";

    document.getElementById("registerForm").reset();
});
</script>

</body>
</html>
