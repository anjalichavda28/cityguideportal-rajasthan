<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Booking Management | Admin</title><link rel="stylesheet" href="css/style.css"></head><body><header class="navbar"><div class="nav-container"><a class="logo" href="admin-dashboard.html">RAJASTHAN ADMIN</a><nav class="nav-links"><a href="admin-dashboard.html">Dashboard</a><a href="index.html">View Website</a></nav></div></header><section class="page-hero"><div class="page-hero-content"><span>ADMINISTRATION</span><h1>Booking Management</h1><p>Review demo hotel and restaurant booking requests.</p></div></section><main class="booking-page"><div id="adminBookings"></div></main><script>
const items=JSON.parse(localStorage.getItem("rajasthanBookings")||"[]");const el=document.getElementById("adminBookings");if(!items.length){el.innerHTML="<div class='empty-state'>No booking requests found in this browser.</div>"}else{el.innerHTML=`<div class='table-wrap'><table class='booking-table'><tr><th>ID</th><th>Type</th><th>Place</th><th>Guest</th><th>Date</th><th>Details</th><th>Payment Mode</th><th>Status</th></tr>${items.map((b,i)=>`<tr><td>${b.id}</td><td>${b.type}</td><td>${b.place}</td><td>${b.name}<br>${b.phone}</td><td>${b.date}</td><td>${b.details}</td><td>${b.paymentMode||"Not selected (old booking)"}</td><td><select onchange="changeStatus(${i},this.value)"><option ${b.status==="Pending"?"selected":""}>Pending</option><option ${b.status==="Confirmed"?"selected":""}>Confirmed</option><option ${b.status==="Cancelled"?"selected":""}>Cancelled</option></select></td></tr>`).join("")}</table></div>`}
function changeStatus(i,status){items[i].status=status;localStorage.setItem("rajasthanBookings",JSON.stringify(items));alert("Booking status updated.");}
</script></body></html>
