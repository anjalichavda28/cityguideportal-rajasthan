<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Bookings | Rajasthan Guide</title><link rel="stylesheet" href="css/style.css"></head><body><header class="navbar"><div class="nav-container"><a class="logo" href="index.html">RAJASTHAN <small>City Guide Portal</small></a><nav class="nav-links"><a href="index.html">Home</a><a href="hotels.html">Hotels</a><a href="restaurants.html">Restaurants</a><a href="user-dashboard.html">Dashboard</a></nav></div></header><section class="page-hero"><div class="page-hero-content"><span>YOUR TRAVEL PLANS</span><h1>My Bookings</h1><p>All demo booking requests saved in this browser.</p></div></section><main class="booking-page"><div id="myBookings"></div></main><script>
const all=JSON.parse(localStorage.getItem("rajasthanBookings")||"[]");const el=document.getElementById("myBookings");if(!all.length){el.innerHTML="<div class='empty-state'>No bookings yet. Explore hotels or restaurants to make a demo booking.</div>"}else{el.innerHTML=all.map(b=>`<div class="user-info-card" style="margin-bottom:15px"><h2>${b.place}</h2><p><b>Type:</b> ${b.type==="hotel"?"Hotel booking":"Restaurant reservation"}</p><p><b>Booking ID:</b> ${b.id}</p><p><b>Date:</b> ${b.date}</p><p><b>Details:</b> ${b.details}</p><p><b>Guest:</b> ${b.name} · ${b.phone}</p><p><b>Estimated total:</b> ₹${Number(b.total||0).toLocaleString("en-IN")}</p><p><b>Payment Mode:</b> ${b.paymentMode||"Not selected (old booking)"}</p><span class="status pending">${b.status}</span></div>`).join("")}
</script></body></html>
