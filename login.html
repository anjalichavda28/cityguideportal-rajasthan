
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Rajasthan City Guide Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">
            <span>RAJASTHAN</span>
            <small>City Guide Portal</small>
        </a>
        <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="cities.html">Cities</a>
            <a href="places.html">Places</a>
            <a href="hotels.html">Hotels</a>
            <a href="restaurants.html">Restaurants</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<section class="auth-section">
    <div class="auth-card">
        <div class="auth-icon"><i class="fas fa-user-circle"></i></div>
        <h1>Welcome Back</h1>
        <p>Login to your Rajasthan travel account.</p>

        <form id="loginForm">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button type="submit" class="auth-submit">Login</button>
            <p id="loginMessage" class="form-message"></p>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Register Now</a>
        </p>
        <a href="index.html" class="back-home">← Back to Home</a>
    </div>
</section>

<footer class="footer">
    <div class="footer-bottom">
        <p>© 2026 City Guide Portal – Rajasthan. All Rights Reserved.</p>
    </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("loginMessage");

    const users = JSON.parse(localStorage.getItem("rajasthanUsers")) || [];

    const user = users.find(u =>
        u.email.toLowerCase() === email && u.password === password
    );

    if (user) {
        localStorage.setItem("rajasthanLoggedInUser", JSON.stringify({
            name: user.name,
            email: user.email
        }));

        message.textContent = "Login successful! Welcome, " + user.name + ".";
        message.className = "form-message success";

        setTimeout(() => {
                window.location.href = "user-dashboard.html";     
       }, 1000);
    } else {
        message.textContent = "Invalid email or password. Please register first.";
        message.className = "form-message error";
    }
});
</script>

</body>
</html>
